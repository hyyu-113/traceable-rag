<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traceable · 企业文档智能知识库</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <aside>
    <a class="brand" href="/" aria-label="Traceable 首页"><span class="brand-icon">T</span> traceable<span class="brand-dot">.</span></a>
    <div class="workspace"><span class="workspace-icon">▦</span><div>企业文档知识库<small>文档问答工作区</small></div><span class="tag">演示版</span></div>
    <div class="sidebar-title">知识来源 <span id="count">0</span></div>
    <label class="upload-box" for="files"><span class="upload-symbol">＋</span><strong>添加企业文档</strong><span>点击选择 PDF / DOCX / XLSX</span><small id="upload-limit">正在获取文件大小限制…</small></label>
    <input id="files" type="file" accept=".pdf,.docx,.xlsx" multiple>
    <div id="upload-status" role="status" aria-live="polite"></div>
    <div id="documents" class="documents"><p class="muted">还没有文档，上传后即可开始提问。</p></div>
    <div class="sidebar-footer"><span class="status-dot"></span><span id="health">正在检查服务…</span><a href="/docs" target="_blank" rel="noopener">接口文档 ↗</a></div>
  </aside>
  <main>
    <header><div><span class="eyebrow">文档检索与问答</span><h1>每一个回答，附上原文出处。</h1></div><span class="private-label">文档 · 检索 · 原文证据</span></header>
    <div id="setup" class="setup" hidden>服务暂未就绪，请联系管理员检查数据库连接和模型配置。</div>
    <section class="chat-area" id="chat-area" aria-live="polite">
      <div id="welcome" class="welcome"><div class="welcome-icon">⌕</div><span class="eyebrow">从文档，到答案</span><h2>查询文档内容，核对原文依据</h2><p>上传制度、合同或价格表。直接提问，<br>同时查看支撑答案的原文和具体位置。</p>
        <div class="suggestions"><button data-question="北京普通员工的住宿标准是多少？"><span>01 / 人事制度</span>北京普通员工的住宿标准是多少？ ↗</button><button data-question="合同规定的软件交付周期是多少？"><span>02 / 采购合同</span>合同规定的软件交付周期是多少？ ↗</button><button data-question="A100型号产品价格是多少？"><span>03 / 产品数据</span>A100 型号产品价格是多少？ ↗</button></div>
      </div>
      <div id="messages"></div>
    </section>
    <form id="chat-form" class="composer"><label class="sr-only" for="question">向知识库提问</label><textarea id="question" rows="2" maxlength="2000" placeholder="向你的文档提问…"></textarea><div class="composer-bottom"><span>回答附带原文引用 · 无足够证据时明确告知</span><button id="send" type="submit">发送 <span>↑</span></button></div></form>
    <footer>文档问答 <span>引用可核验；重要信息请打开原文件核对。</span></footer>
  </main>
</body>
</html>
